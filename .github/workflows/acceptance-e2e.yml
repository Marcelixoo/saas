name: acceptance-e2e

# System-level Playwright acceptance suite.
#
# During feature development this workflow is INFORMATIONAL / NON-BLOCKING:
# the suite is intentionally RED until the platform exists. It must never gate
# normal unit/build CI. Once all feature PRs are merged, the final
# `final/acceptance-gate` branch flips this to blocking against the deployed
# (k8s) environment.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Admin UI base URL'
        required: false
        default: 'http://localhost:3000'
      api_url:
        description: 'Fastify control-plane URL'
        required: false
        default: 'http://localhost:8080'
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/acceptance-e2e.yml'

# Non-blocking: this job is allowed to fail while features are being built.
jobs:
  acceptance:
    name: playwright-acceptance (informational)
    runs-on: ubuntu-latest
    # Do not fail the overall check suite while the platform is incomplete.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run acceptance suite (informational)
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
          E2E_API_URL: ${{ github.event.inputs.api_url || 'http://localhost:8080' }}
          E2E_EMAIL: assessor@e2e.test
          E2E_PASSWORD: Passw0rd!e2e
        run: npx playwright test || echo "Acceptance suite is expected to be RED until the platform is complete."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
