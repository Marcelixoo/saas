name: Control Plane CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/control-plane/**'
      - '.github/workflows/control-plane-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'apps/control-plane/**'
      - '.github/workflows/control-plane-ci.yml'

defaults:
  run:
    working-directory: apps/control-plane

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
