name: Deploy to GKE

# Builds and deploys the full multi-service platform (web, control-plane,
# search-api) to the production GKE cluster provisioned by
# infra/terraform/. Authenticates via Workload Identity Federation
# (google-github-actions/auth@v2) — no long-lived service-account key is
# ever stored as a GitHub secret.
#
# This workflow is INERT until ALL of the repo variables below are
# configured (see infra/terraform/README.md for how to obtain them after
# `terraform apply`). The check-config gate job requires every one of them
# to be set and SKIPS (not fails) the deploy otherwise — a partial
# configuration (e.g. WIF set but GCP_ARTIFACT_REGISTRY missing) is treated
# the same as "not configured yet", so this never lets the deploy job run
# and hard-fail partway through. Merging this file never turns main red.
#
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  - infra/terraform output: workload_identity_provider
#   GCP_SERVICE_ACCOUNT             - infra/terraform output: deploy_service_account_email
#   GCP_PROJECT_ID                  - the GCP project terraform was applied against, e.g. criticalmars-saas
#   GCP_REGION                      - the region terraform was applied against, e.g. europe-west3
#   GCP_ARTIFACT_REGISTRY           - infra/terraform output: artifact_registry_repository
#                                      (full path, e.g. europe-west3-docker.pkg.dev/<project>/saas)
#   GCP_CLUSTER_NAME                - infra/terraform var/output: cluster_name, e.g. saas-gke
#   PROD_API_URL                    - browser-reachable control-plane URL, baked into the
#                                      web image at build time (NEXT_PUBLIC_API_URL), e.g.
#                                      https://api.example.com
#
# Optional repo secret (Settings -> Secrets and variables -> Actions -> Secrets):
#   SLACK_DEPLOY_WEBHOOK_URL        - Slack "Incoming Webhook" URL. When set, the
#                                      notify-on-failure job posts to it if
#                                      build-and-deploy fails (see docs/observability.md).
#                                      Absent -> that job silently no-ops.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required deploy configuration is present
        id: check
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          GCP_CLUSTER_NAME: ${{ vars.GCP_CLUSTER_NAME }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          # Every repo variable the build-and-deploy job actually reads
          # must be set — a partial configuration (e.g. WIF set but
          # GCP_ARTIFACT_REGISTRY missing) must SKIP the deploy, not let it
          # run and hard-fail partway through.
          missing=""
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REGISTRY GCP_CLUSTER_NAME PROD_API_URL; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required repo variables are set; deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing repo variable(s):${missing}. Skipping deploy (see infra/terraform/README.md)."
          fi

  build-and-deploy:
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by google-github-actions/auth@v2 for WIF
    env:
      # check-config (above) guarantees all of these are set before this
      # job runs, so no fallback defaults are used here.
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      CLUSTER_NAME: ${{ vars.GCP_CLUSTER_NAME }}
      NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push control-plane image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/control-plane.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/control-plane:${{ github.sha }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      - name: Build and push search-api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/search-api:${{ github.sha }}
          cache-from: type=gha,scope=search-api
          cache-to: type=gha,mode=max,scope=search-api

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set image tags in the gke overlay
        working-directory: infra/k8s/overlays/gke
        run: |
          kustomize edit set image \
            "saas/web=${REGISTRY}/web:${{ github.sha }}" \
            "saas/control-plane=${REGISTRY}/control-plane:${{ github.sha }}" \
            "saas/search-api=${REGISTRY}/search-api:${{ github.sha }}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Sync saas-secrets from Secret Manager
        # GCP Secret Manager (provisioned by infra/terraform/secrets.tf) is
        # the source of truth for prod secrets. This reads the latest
        # version of each into shell variables (never echoed/logged — no
        # set -x, gcloud output is captured into a var not printed to
        # stdout) and materializes them as the native k8s Secret the
        # Deployments already reference via secretKeyRef: saas-secrets. The
        # gke overlay itself deletes the base's dev-placeholder Secret, so
        # this step must run before `kubectl apply -k`.
        run: |
          kubectl get namespace saas >/dev/null 2>&1 || kubectl create namespace saas

          POSTGRES_USER="$(gcloud secrets versions access latest --secret=saas-POSTGRES_USER --project="$PROJECT_ID")"
          POSTGRES_PASSWORD="$(gcloud secrets versions access latest --secret=saas-POSTGRES_PASSWORD --project="$PROJECT_ID")"
          DATABASE_URL="$(gcloud secrets versions access latest --secret=saas-DATABASE_URL --project="$PROJECT_ID")"
          JWT_SECRET="$(gcloud secrets versions access latest --secret=saas-JWT_SECRET --project="$PROJECT_ID")"
          JWT_SECRET_KEY="$(gcloud secrets versions access latest --secret=saas-JWT_SECRET_KEY --project="$PROJECT_ID")"
          MEILISEARCH_API_KEY="$(gcloud secrets versions access latest --secret=saas-MEILISEARCH_API_KEY --project="$PROJECT_ID")"

          kubectl create secret generic saas-secrets \
            --namespace saas \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=MEILISEARCH_API_KEY="$MEILISEARCH_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: kubectl apply -k infra/k8s/overlays/gke

      - name: Wait for rollout (auto-rollback on failure)
        run: |
          # Wait for each Deployment to become healthy. Because every
          # Deployment has readiness probes and the default RollingUpdate
          # strategy, a broken new pod never becomes Ready, so old pods keep
          # serving (no downtime) and `rollout status` fails — a timeout, or
          # another non-zero exit such as a progress-deadline breach — instead
          # of reporting success. On any such failure we automatically roll the
          # Deployment back to its previous ReplicaSet, confirm that
          # last-good revision is healthy, and then fail the job so the bad
          # release is surfaced — leaving the cluster on the last-good state
          # rather than a stuck half-rolled-out one.
          #
          # Scope/caveats (intentional for this in-pipeline rollback):
          #   * `rollout undo` reverts a Deployment's pod template (image +
          #     env template) only. ConfigMap/Secret changes applied by
          #     `kubectl apply -k` are NOT reverted; an image-only deploy —
          #     the common case — rolls back cleanly.
          #   * Forward DB migrations (control-plane runs `prisma migrate
          #     deploy` on start) are not reverted. Keep migrations additive
          #     / backward-compatible so the previous image runs against a
          #     migrated schema.
          set -uo pipefail
          deployments=(web control-plane search-api)
          failed=""
          for d in "${deployments[@]}"; do
            echo "::group::rollout status: $d"
            if kubectl -n saas rollout status "deployment/$d" --timeout=300s; then
              echo "$d: healthy"
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
            echo "::error::$d failed to roll out; attempting automatic rollback"
            # Diagnostics (no app logs — avoids leaking secrets into CI output):
            kubectl -n saas describe "deployment/$d" | tail -n 40 || true
            kubectl -n saas get pods -l "app=$d" -o wide || true
            if kubectl -n saas rollout undo "deployment/$d"; then
              if kubectl -n saas rollout status "deployment/$d" --timeout=180s; then
                echo "::warning::$d rolled back to previous revision (now healthy)"
              else
                echo "::error::$d rollback did not become healthy — manual intervention required"
              fi
            else
              echo "::error::$d rollback command failed (no previous revision, or another kubectl error printed above) — manual intervention required"
            fi
            failed="${failed} $d"
          done
          if [ -n "$failed" ]; then
            echo "::error::Deploy failed and was rolled back for:${failed}"
            exit 1
          fi
          echo "All deployments rolled out successfully."

  notify-on-failure:
    # Fires whenever build-and-deploy fails for any reason (image build,
    # rollout timeout + failed auto-rollback, etc.) — see the "Wait for
    # rollout" step above, which already fails the job on a bad rollout but
    # (until this job existed) alerted nobody. This job never blocks or
    # gates the deploy; it only reports on an outcome that already happened.
    needs: [check-config, build-and-deploy]
    if: always() && needs.check-config.outputs.configured == 'true' && needs.build-and-deploy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify deploy failure (Slack webhook, if configured)
        env:
          # Optional repo secret (Settings -> Secrets and variables ->
          # Actions -> Secrets): SLACK_DEPLOY_WEBHOOK_URL, an "Incoming
          # Webhook" URL for the channel that should hear about failed
          # prod deploys. The secret's value is never echoed/logged here.
          # This step is a deliberate no-op — not a failure — when the
          # secret is absent, so adding this job never breaks CI for a
          # fork/clone that hasn't configured it yet.
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SLACK_DEPLOY_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_DEPLOY_WEBHOOK_URL secret not set; skipping deploy-failure notification. See infra/monitoring/README.md and docs/observability.md for how to configure it."
            exit 0
          fi
          payload=$(printf '{"text":":rotating_light: GKE deploy failed for %s @ %s\\n%s"}' \
            "${GITHUB_REPOSITORY}" "${COMMIT_SHA}" "${RUN_URL}")
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_DEPLOY_WEBHOOK_URL" \
            || echo "::warning::Failed to deliver deploy-failure Slack notification"
