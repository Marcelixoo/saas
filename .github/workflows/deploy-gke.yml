name: Deploy to GKE

# Builds and deploys the full multi-service platform (web, control-plane,
# search-api) to the production GKE cluster provisioned by
# infra/terraform/. Authenticates via Workload Identity Federation
# (google-github-actions/auth@v2) — no long-lived service-account key is
# ever stored as a GitHub secret.
#
# This workflow is INERT until the repo variables below are configured
# (see infra/terraform/README.md for how to obtain them after
# `terraform apply`). The gate job below SKIPS (not fails) the deploy when
# they're absent, so merging this file never turns main red.
#
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  - infra/terraform output: workload_identity_provider
#   GCP_SERVICE_ACCOUNT             - infra/terraform output: deploy_service_account_email
#   GCP_PROJECT_ID                  - defaults to criticalmars-saas if unset
#   GCP_REGION                      - defaults to europe-west3 if unset
#   GCP_ARTIFACT_REGISTRY           - infra/terraform output: artifact_registry_repository
#                                      (full path, e.g. europe-west3-docker.pkg.dev/<project>/saas)
#   GCP_CLUSTER_NAME                - defaults to saas-gke if unset
#   PROD_API_URL                    - browser-reachable control-plane URL, baked into the
#                                      web image at build time (NEXT_PUBLIC_API_URL), e.g.
#                                      https://api.example.com

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required WIF/deploy configuration is present
        id: check
        run: |
          if [ -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] && [ -n "${{ vars.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT are set; deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT repo variables are not set. Skipping deploy (see infra/terraform/README.md)."
          fi

  build-and-deploy:
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by google-github-actions/auth@v2 for WIF
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'criticalmars-saas' }}
      REGION: ${{ vars.GCP_REGION || 'europe-west3' }}
      REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      CLUSTER_NAME: ${{ vars.GCP_CLUSTER_NAME || 'saas-gke' }}
      NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push control-plane image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/control-plane.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/control-plane:${{ github.sha }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

      - name: Build and push search-api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/search-api:${{ github.sha }}
          cache-from: type=gha,scope=search-api
          cache-to: type=gha,mode=max,scope=search-api

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set image tags in the gke overlay
        working-directory: infra/k8s/overlays/gke
        run: |
          kustomize edit set image \
            "saas/web=${REGISTRY}/web:${{ github.sha }}" \
            "saas/control-plane=${REGISTRY}/control-plane:${{ github.sha }}" \
            "saas/search-api=${REGISTRY}/search-api:${{ github.sha }}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy
        run: kubectl apply -k infra/k8s/overlays/gke

      - name: Wait for rollout
        run: |
          kubectl -n saas rollout status deployment/web --timeout=300s
          kubectl -n saas rollout status deployment/control-plane --timeout=300s
          kubectl -n saas rollout status deployment/search-api --timeout=300s
