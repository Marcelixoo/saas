name: K8s manifests lint

# Non-blocking sanity check that the Kustomize overlays owned by Agent E
# (infra/k8s/**) render cleanly. It does NOT deploy anywhere (no cluster
# credentials are available in CI) — see infra/README.md for the verified
# local k3d deployment procedure and evidence.

on:
  pull_request:
    paths:
      - "infra/k8s/**"
      - ".github/workflows/k8s-manifests-lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kustomize-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render local overlay
        run: kubectl kustomize infra/k8s/overlays/local > /tmp/local.yaml

      - name: Render gke overlay
        run: kubectl kustomize infra/k8s/overlays/gke > /tmp/gke.yaml

      - name: Dry-run validate manifests (client-side only)
        run: |
          kubectl apply --dry-run=client -f /tmp/local.yaml
          kubectl apply --dry-run=client -f /tmp/gke.yaml
