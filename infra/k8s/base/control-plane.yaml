apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: saas
  labels:
    app: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 2;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "waiting for redis..."; sleep 2;
              done
        - name: wait-for-search-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z search-api 8081; do
                echo "waiting for search-api..."; sleep 2;
              done
      containers:
        - name: control-plane
          image: saas/control-plane:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: HOST
            - name: SEARCH_API_URL
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: SEARCH_API_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: REDIS_URL
            - name: FREE_SEARCH_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: FREE_SEARCH_LIMIT
            - name: PRO_SEARCH_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: PRO_SEARCH_LIMIT
            - name: ALLOWED_SIGNUP_EMAILS
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: ALLOWED_SIGNUP_EMAILS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: saas
  labels:
    app: control-plane
spec:
  type: ClusterIP
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: 8080
      name: http
