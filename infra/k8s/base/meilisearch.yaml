apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: saas
  labels:
    app: meilisearch
spec:
  serviceName: meilisearch
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.13
          ports:
            - containerPort: 7700
              name: meilisearch
          env:
            - name: MEILI_ENV
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: MEILI_ENV
            - name: MEILI_NO_ANALYTICS
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: MEILI_NO_ANALYTICS
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: MEILISEARCH_API_KEY
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: meili-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: saas
  labels:
    app: meilisearch
spec:
  clusterIP: None
  selector:
    app: meilisearch
  ports:
    - port: 7700
      targetPort: 7700
      name: meilisearch
