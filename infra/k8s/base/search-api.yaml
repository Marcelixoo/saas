apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: saas
  labels:
    app: search-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      initContainers:
        - name: wait-for-meilisearch
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -T 2 -O /dev/null http://meilisearch:7700/health; do
                echo "waiting for meilisearch..."; sleep 2;
              done
      containers:
        - name: search-api
          image: saas/search-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: SERVER_PORT
            - name: MEILISEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: saas-config
                  key: MEILISEARCH_HOST
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: MEILISEARCH_API_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: saas
  labels:
    app: search-api
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
    - port: 8081
      targetPort: 8081
      name: http
