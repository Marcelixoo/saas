apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: saas
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # NEXT_PUBLIC_API_URL is inlined at build time (see infra/docker/web.Dockerfile),
          # since Next.js only reads NEXT_PUBLIC_* vars during `next build`, not at
          # container runtime. It MUST point at the control-plane URL reachable from
          # the assessor's BROWSER (the ingress host), not the in-cluster DNS name.
          image: saas/web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: saas
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
      name: http
