# Production ingress: GCE Ingress class, a reserved static IP (from
# infra/terraform, see the ingress_static_ip_name output — defaults to
# "saas-ingress-ip"), and a GKE-managed cert (managed-certificate.yaml).
#
# Hostnames are criticalmars.me (operator-controlled): web.criticalmars.me
# and api.criticalmars.me. Point their DNS A records at the static IP
# reserved by infra/terraform (`terraform output ingress_static_ip_address`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-ingress
  namespace: saas
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: saas-ingress-ip
    networking.gke.io/managed-certificates: saas-managed-cert
    networking.gke.io/v1beta1.FrontendConfig: saas-frontend-config
spec:
  rules:
    - host: web.criticalmars.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.criticalmars.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 8080
