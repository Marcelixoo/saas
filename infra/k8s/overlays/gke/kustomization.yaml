# Production GKE overlay. Deployed via .github/workflows/deploy-gke.yml,
# which authenticates via Workload Identity Federation, builds+pushes the
# three app images to Artifact Registry, points `images:` below at them
# with `kustomize edit set image`, and runs `kubectl apply -k` here.
#
# Before the FIRST real deploy, an operator must also:
#   1. `terraform apply` infra/terraform/ (creates the cluster, Artifact
#      Registry repo, deploy service account, and reserves the static IP
#      referenced by ingress-patch.yaml).
#   2. Supply a real `saas-secrets` Secret out-of-band (see
#      infra/k8s/overlays/gke/README.md / secret.example.yaml) — this
#      overlay deletes the base's dev-placeholder Secret rather than
#      shipping it, on purpose.
#   3. Replace the placeholder hostnames in ingress-patch.yaml and
#      managed-certificate.yaml with real, DNS-controlled domains.
#
# `kubectl kustomize infra/k8s/overlays/gke` builds cleanly without any of
# the above (no live cluster/secrets needed to render the manifests) —
# they're only required to actually `apply` this overlay successfully.

resources:
  - ../../base
  - managed-certificate.yaml
  - frontend-config.yaml

patches:
  - path: ingress-patch.yaml
  - path: production-patch.yaml
  - path: secret-delete-patch.yaml

images:
  - name: saas/web
    newName: REPLACE_WITH_ARTIFACT_REGISTRY_PATH/web
    newTag: REPLACE_WITH_GIT_SHA
  - name: saas/control-plane
    newName: REPLACE_WITH_ARTIFACT_REGISTRY_PATH/control-plane
    newTag: REPLACE_WITH_GIT_SHA
  - name: saas/search-api
    newName: REPLACE_WITH_ARTIFACT_REGISTRY_PATH/search-api
    newTag: REPLACE_WITH_GIT_SHA
