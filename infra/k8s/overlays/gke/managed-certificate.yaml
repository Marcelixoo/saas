# GKE-managed TLS certificate (works only with the GCE Ingress class, i.e.
# alongside the "gce" ingress.class annotation in ingress-patch.yaml).
# Domains are criticalmars.me (operator-controlled) — GCP issues the cert
# only after they resolve to the ingress's IP. See
# infra/k8s/overlays/gke/README.md.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: saas-managed-cert
  namespace: saas
spec:
  domains:
    - web.criticalmars.me
    - api.criticalmars.me
