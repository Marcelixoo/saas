# Removes the base's dev-placeholder `saas-secrets` Secret from this
# overlay's output entirely. Production secrets are NEVER committed to
# git — see infra/k8s/overlays/gke/README.md for how to supply them.
#
# `kubectl apply -k infra/k8s/overlays/gke` will therefore fail fast if a
# real `saas-secrets` Secret has not been created out-of-band first (the
# Deployments' secretKeyRef lookups fail loudly rather than silently
# succeeding against a dev placeholder value).
apiVersion: v1
kind: Secret
metadata:
  name: saas-secrets
  namespace: saas
$patch: delete
