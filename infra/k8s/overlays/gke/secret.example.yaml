# Template only — NOT referenced by kustomization.yaml, NOT applied by
# `kubectl apply -k`.
#
# PRODUCTION PATH (default, since infra/terraform/secrets.tf): these values
# are provisioned in GCP Secret Manager by Terraform and materialized into
# the cluster as this same `saas-secrets` Secret by
# `.github/workflows/deploy-gke.yml` on every deploy (reads the latest
# Secret Manager version of each key via `gcloud secrets versions access`,
# then `kubectl apply`s a generated Secret — no operator handles raw
# values, nothing is committed to git). Rotate a value by writing a new
# Secret Manager version (e.g. `terraform apply` after changing a
# `random_password`, or `gcloud secrets versions add`); the next deploy
# picks it up automatically.
#
# FALLBACK (documented, not the default): if you're not using the
# Terraform-managed Secret Manager path, copy this file, fill in real
# values, and apply it out-of-band (kept out of git) BEFORE
# `kubectl apply -k infra/k8s/overlays/gke`:
#
#   cp infra/k8s/overlays/gke/secret.example.yaml /tmp/saas-secrets.yaml
#   # edit /tmp/saas-secrets.yaml with real values
#   kubectl apply -f /tmp/saas-secrets.yaml
#   kubectl apply -k infra/k8s/overlays/gke
#
# Note the CD workflow's Secret Manager sync step will overwrite this
# Secret on the next deploy, so the fallback only makes sense if you also
# remove/skip that step.
apiVersion: v1
kind: Secret
metadata:
  name: saas-secrets
  namespace: saas
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
  DATABASE_URL: "postgresql://REPLACE_ME:REPLACE_ME@postgres:5432/saas"
  JWT_SECRET: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
  JWT_SECRET_KEY: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
  MEILISEARCH_API_KEY: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
