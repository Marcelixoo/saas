# Template only — NOT referenced by kustomization.yaml, NOT applied by
# `kubectl apply -k`. Copy this file, fill in real values, and apply it
# out-of-band (kept out of git) BEFORE `kubectl apply -k infra/k8s/overlays/gke`:
#
#   cp infra/k8s/overlays/gke/secret.example.yaml /tmp/saas-secrets.yaml
#   # edit /tmp/saas-secrets.yaml with real values
#   kubectl apply -f /tmp/saas-secrets.yaml
#   kubectl apply -k infra/k8s/overlays/gke
#
# Recommended production path instead of a plain Secret: provision these
# values in GCP Secret Manager and mount them via the Secret Manager CSI
# driver (https://secrets-store-csi-driver.sigs.k8s.io/ +
# https://github.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp),
# projecting them into a SecretProviderClass-backed volume or syncing to a
# native k8s Secret of this same name/shape via the driver's
# `secretObjects` sync feature. That keeps the source of truth in Secret
# Manager (versioned, audited, IAM-controlled) instead of a Secret object
# an operator has to remember to rotate/apply by hand.
apiVersion: v1
kind: Secret
metadata:
  name: saas-secrets
  namespace: saas
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
  DATABASE_URL: "postgresql://REPLACE_ME:REPLACE_ME@postgres:5432/saas"
  JWT_SECRET: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
  JWT_SECRET_KEY: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
  MEILISEARCH_API_KEY: "REPLACE_ME_WITH_A_STRONG_RANDOM_VALUE"
