# Dev-only secret values for the local k3d overlay. These are placeholders,
# never real credentials — see infra/README.md for how to rotate them.
apiVersion: v1
kind: Secret
metadata:
  name: saas-secrets
  namespace: saas
type: Opaque
stringData:
  POSTGRES_USER: "saas"
  POSTGRES_PASSWORD: "saas-dev-password"
  DATABASE_URL: "postgresql://saas:saas-dev-password@postgres:5432/saas"
  JWT_SECRET: "local-dev-jwt-secret-change-me"
  JWT_SECRET_KEY: "local-dev-jwt-secret-change-me"
  MEILISEARCH_API_KEY: "local-dev-meili-key-change-me"
